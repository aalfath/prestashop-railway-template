# Railway terminates TLS at its edge and forwards plain HTTP.
# Tell PHP the original request was HTTPS so PrestaShop doesn't redirect-loop.
ServerName localhost
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Railway's proxy connects from rotating 100.64.0.0/10 addresses and puts the
# visitor's address in X-Real-IP. Without this, PrestaShop's "check the cookie's
# IP address" setting (on by default) logs the admin out on every request.
RemoteIPHeader X-Real-IP
RemoteIPInternalProxy 100.64.0.0/10

# Health check for Railway, outside the shop (and outside the volume).
Alias /healthz /opt/railway/healthz.txt
<Directory /opt/railway>
    Require all granted
</Directory>
